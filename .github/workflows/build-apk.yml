name: Build APK Puzzlea

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Configurar Java
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4.4.1

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Firmar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          test -n "$APK" || { echo "No se ha encontrado el APK"; exit 1; }
          echo "APK generado: $APK"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Usando build-tools: $BUILD_TOOLS"

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

          mkdir -p dist
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out dist/Puzzlea.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose dist/Puzzlea.apk

          rm -f "$RUNNER_TEMP/release.jks"
          ls -lh dist/

      - name: Subir artefacto
        uses: actions/upload-artifact@v4.6.2
        with:
          name: puzzlea-apk_juego
          path: dist/Puzzlea.apk
          if-no-files-found: error
          retention-days: 30

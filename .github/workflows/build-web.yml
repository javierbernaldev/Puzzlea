name: Build web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar imágenes por defecto (images_default/)
        run: node scripts/prepare-images.mjs

      - name: Subir web
        uses: actions/upload-artifact@v4
        with:
          name: puzzlea-web
          path: www
          retention-days: 90

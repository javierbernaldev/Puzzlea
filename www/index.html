<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1f3b">
<title>Puzzlea</title>
<style>
:root{--bg:#1b1f3b;--card:#262b52;--card2:#323974;--ink:#f4f5ff;--mute:#9aa0d0;--acc:#ffb703;--acc2:#4cc9f0;--ok:#3ddc84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:14px;gap:10px}
.screen.on{display:flex}
button{font:inherit;border:0;border-radius:16px;background:var(--card);color:var(--ink);font-weight:700;padding:12px 16px;transition:transform .08s}
button:active{transform:scale(.93)}
button:disabled{opacity:.6}
.ib{width:50px;height:50px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:24px;line-height:1;flex:none}
.ib svg{display:block}

/* inicio */
.top{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:26px;flex:1}
#cloudBtn{background:var(--acc2);color:#10213a;font-size:17px;padding:13px 16px;width:100%}
#gallery{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:start;padding:2px}
@media(min-width:560px){#gallery{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){#gallery{grid-template-columns:repeat(5,1fr)}}
.thumb{position:relative;aspect-ratio:1;border-radius:18px;background:var(--card) center/cover;border:4px solid transparent}
.thumb.sel{border-color:var(--acc);box-shadow:0 0 0 3px #ffb70055}
.thumb.sel::after{content:"✓";position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#1b1f3b;display:grid;place-items:center;font-weight:900}
.add{display:grid;place-items:center;font-size:44px;color:var(--mute);border:3px dashed var(--mute);background:transparent}
.empty{grid-column:1/-1;text-align:center;font-size:64px;padding:30px 0;opacity:.8}
.panel{background:var(--card);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:8px;justify-content:center}
.seg button{flex:1;max-width:80px;height:54px;padding:0;display:grid;place-items:center;background:var(--card2);font-size:28px;color:var(--ink)}
.seg button.sel{background:var(--acc);color:#1b1f3b}
#playBtn{width:84px;height:84px;font-size:38px;background:var(--ok);color:#0b3d1f;align-self:center;margin-top:2px;padding:0 0 0 6px;box-shadow:0 6px 0 #1f9a55}
#playBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #1f9a55}

/* juego */
#hud{display:flex;align-items:center;gap:10px}
#bar{flex:1;height:18px;border-radius:9px;background:var(--card);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--ok));border-radius:9px;transition:width .25s}
#stage{position:relative;flex:1;min-height:0;touch-action:none;isolation:isolate}
#board{position:absolute;background:#0e1126;border-radius:6px;touch-action:none;overflow:hidden;box-shadow:inset 0 0 0 2px #2c3270}
#ghost{position:absolute;left:0;top:0;pointer-events:none}
#preview{position:absolute;inset:0;background-size:100% 100%;display:none;z-index:100000}
.piece{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.piece.drag{filter:drop-shadow(0 10px 12px rgba(0,0,0,.5))}
.piece.placed{filter:none}
.piece.snap{transition:transform .12s ease-out}
.tile{position:absolute;background-repeat:no-repeat;transition:left .12s,top .12s;outline:1px solid rgba(0,0,0,.35);outline-offset:-1px}
.tile.empty{visibility:hidden}
#win{position:absolute;inset:0;background:rgba(10,12,30,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:20}
#win.on{display:flex}
#win .big{font-size:96px;line-height:1;animation:pop .6s ease-out}
#win .stars{font-size:44px;letter-spacing:6px}
#win .row{display:flex;gap:22px}
#win .ib{width:76px;height:76px;font-size:38px}
#win .go{background:var(--ok);color:#0b3d1f}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg);opacity:0}70%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1);opacity:1}}
#toast{pointer-events:none;max-width:86vw;text-align:center;position:fixed;left:50%;top:76px;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:20px;display:none;z-index:99;font-size:15px}
</style>
</head>
<body>

<div id="home" class="screen on">
  <div class="top">
    <h1>🧩 Puzzlea</h1>
    <button id="soundBtn" class="ib" aria-label="Sonido">🔊</button>
  </div>
  <button id="cloudBtn">☁️ Descargar puzzles</button>
  <div id="gallery"></div>
  <div class="panel">
    <div class="seg" id="modeRow"></div>
    <div class="seg" id="sizeRow"></div>
  </div>
  <button id="playBtn" class="ib" aria-label="Jugar">▶</button>
  <input type="file" id="file" accept="image/*" multiple hidden>
</div>

<div id="game" class="screen">
  <div id="hud">
    <button id="backBtn" class="ib" aria-label="Inicio">🏠</button>
    <div id="bar"><i></i></div>
    <button id="peekBtn" class="ib" aria-label="Ver imagen">👁</button>
    <button id="soundBtn2" class="ib" aria-label="Sonido">🔊</button>
    <button id="shuffleBtn" class="ib" aria-label="Reiniciar">↻</button>
  </div>
  <div id="stage"><div id="board"><div id="preview"></div></div></div>
  <div id="win">
    <div class="big">🎉</div>
    <div class="stars">⭐⭐⭐</div>
    <div class="row">
      <button id="againBtn" class="ib go" aria-label="Otra vez">↻</button>
      <button id="menuBtn" class="ib" aria-label="Inicio">🏠</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
/* Servidor de imágenes: fijo, no se puede cambiar desde la app */
const SERVER_URL='https://fbm-622215956948-eu-west-1-an.s3.eu-west-1.amazonaws.com/juegos/Puzzlea/';
const DPR=Math.min(window.devicePixelRatio||1,2.5);
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('imagen no válida'));i.src=src});

/* ---------- Almacén de imágenes descargadas/subidas (IndexedDB) ---------- */
const DB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('puzzles',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('imgs',{keyPath:'id',autoIncrement:true});
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const q=fn(db.transaction('imgs',mode).objectStore('imgs'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  all(){return this.run('readonly',s=>s.getAll())},
  add(data,src){return this.run('readwrite',s=>s.add({data,src}))},
  clear(){return this.run('readwrite',s=>s.clear())}
};

/* ---------- Estado y ajustes (se guardan de una vez para otra) ---------- */
let images=[], selected=0, mode='jigsaw', N=3, sound=true;
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
try{
  if(localStorage.getItem('mode')==='slide')mode='slide';
  const n=+localStorage.getItem('N');if(n>=2&&n<=6)N=n;
  sound=localStorage.getItem('sound')!=='0';
}catch(e){}

/* puzzles por defecto: los de la carpeta images/ del repositorio, empaquetados en la app */
async function loadBuiltin(){
  try{
    const r=await fetch('images/manifest.json',{cache:'no-store'});
    if(!r.ok)return [];
    return (await r.json()).map(f=>({id:null,builtin:true,data:'images/'+encodeURIComponent(f)}));
  }catch(e){return []}
}
async function loadImages(){
  let saved=[];try{saved=await DB.all()}catch(e){}
  images=(await loadBuiltin()).concat(saved);
  if(selected>=images.length)selected=0;
  renderGallery();
}
function renderGallery(){
  const g=$('#gallery');g.innerHTML='';
  if(!images.length){const e=document.createElement('div');e.className='empty';e.textContent='🖼️';g.appendChild(e)}
  images.forEach((im,i)=>{
    const d=document.createElement('div');d.className='thumb'+(i===selected?' sel':'');
    d.style.backgroundImage='url("'+im.data+'")';
    d.onclick=()=>{selected=i;renderGallery()};
    g.appendChild(d);
  });
  const a=document.createElement('div');a.className='thumb add';a.textContent='+';
  a.onclick=()=>$('#file').click();g.appendChild(a);
}

/* recorta al cuadrado y reduce a 1024 */
function fileToSquare(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const s=Math.min(img.naturalWidth,img.naturalHeight),out=Math.min(1024,s);
      const c=document.createElement('canvas');c.width=c.height=out;
      c.getContext('2d').drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,out,out);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.88));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('imagen no válida'))};
    img.src=url;
  });
}
$('#file').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  let ok=0;
  for(const f of files){try{await DB.add(await fileToSquare(f));ok++}catch(err){}}
  if(ok){await loadImages();selected=images.length-1;renderGallery();toast('✅ '+ok)}else toast('❌');
};

/* ---------- Descarga desde el servidor (bucket S3) ---------- */
/* En la app (Android) se usa la red nativa, que no depende de CORS; en la web, fetch normal. */
function b64Blob(b64,type){
  const bin=atob(b64),u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return new Blob([u8],{type});
}
async function httpGet(url,as){            /* as: 'text' | 'blob' */
  const H=NATIVE&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CapacitorHttp;
  if(H){
    let r;
    try{r=await H.request({url,method:'GET',responseType:as==='blob'?'blob':'text',connectTimeout:15000,readTimeout:60000})}
    catch(e){r=null}                       /* si falla el plugin, se prueba con fetch */
    if(r){
      if(r.status<200||r.status>=300)throw new Error('HTTP '+r.status);
      if(as==='blob'){
        const h=r.headers||{};
        return b64Blob(r.data,h['Content-Type']||h['content-type']||'image/jpeg');
      }
      return typeof r.data==='string'?r.data:String(r.data);
    }
  }
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return as==='blob'?r.blob():r.text();
}
const IMG_RE=/\.(jpe?g|png|webp|gif|bmp|avif)$/i;
const keyUrl=(origin,key)=>origin+'/'+key.split('/').map(encodeURIComponent).join('/');
async function listBucket(base){
  const u=new URL(base);
  const prefix=decodeURIComponent(u.pathname.replace(/^\//,''));
  const keys=[];let token='';
  do{
    const q=new URL(u.origin+'/');
    q.searchParams.set('list-type','2');
    q.searchParams.set('prefix',prefix);
    if(token)q.searchParams.set('continuation-token',token);
    const x=new DOMParser().parseFromString(await httpGet(q.toString(),'text'),'application/xml');
    for(const k of x.getElementsByTagName('Key'))keys.push(k.textContent);
    const trunc=x.getElementsByTagName('IsTruncated')[0];
    const next=x.getElementsByTagName('NextContinuationToken')[0];
    token=(trunc&&trunc.textContent==='true'&&next)?next.textContent:'';
  }while(token);
  return {origin:u.origin,keys:keys.filter(k=>IMG_RE.test(k))};
}
function netError(e){
  const m=String(e&&e.message||e);
  if(/HTTP 403/.test(m))return '🔒 403';
  if(/HTTP 404/.test(m))return '❓ 404';
  if(/HTTP \d+/.test(m))return '⚠️ '+m;
  return '📡 ✖';
}
let downloading=false;
/* Reemplaza TODOS los puzzles descargados/subidos por los del servidor.
   Los puzzles por defecto (carpeta images/ del repo) no se tocan. */
async function downloadAll(){
  if(downloading)return;
  const btn=$('#cloudBtn'),label='☁️ Descargar puzzles';
  downloading=true;btn.disabled=true;btn.textContent='☁️ …';
  try{
    const {origin,keys}=await listBucket(SERVER_URL);
    if(!keys.length){toast('📭');return}            /* servidor vacío: no se borra nada */
    const old=new Map((await DB.all()).filter(r=>r.src).map(r=>[r.src,r.data]));
    const fresh=[];let fail=0;
    for(let i=0;i<keys.length;i++){
      btn.textContent='☁️ '+(i+1)+' / '+keys.length;
      try{
        const blob=await httpGet(keyUrl(origin,keys[i]),'blob');
        fresh.push({src:keys[i],data:await fileToSquare(blob)});
      }catch(e){
        fail++;
        if(old.has(keys[i]))fresh.push({src:keys[i],data:old.get(keys[i])});   /* se conserva la copia anterior */
      }
    }
    await DB.clear();
    for(const f of fresh)await DB.add(f.data,f.src);
    selected=0;await loadImages();
    toast(fail?('✅ '+(keys.length-fail)+'  ⚠️ '+fail):('✅ '+keys.length));
  }catch(e){
    toast(netError(e));
  }finally{
    downloading=false;btn.disabled=false;btn.textContent=label;
  }
}
$('#cloudBtn').onclick=downloadAll;

/* ---------- Controles con iconos ---------- */
function gridSvg(n,hole){
  const s=24,g=2,cell=(s-g*(n+1))/n;let h='<svg viewBox="0 0 '+s+' '+s+'" width="30" height="30" fill="currentColor">';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if(hole&&r===n-1&&c===n-1)continue;
    h+='<rect x="'+(g+c*(cell+g))+'" y="'+(g+r*(cell+g))+'" width="'+cell+'" height="'+cell+'" rx="1.5"/>';
  }
  return h+'</svg>';
}
function bindIcons(rowId,items,get,set){
  const row=$(rowId);row.innerHTML='';
  const paint=()=>row.querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b.dataset.v==String(get())));
  items.forEach(([v,html,label])=>{
    const b=document.createElement('button');b.dataset.v=v;b.innerHTML=html;b.setAttribute('aria-label',label);
    b.onclick=()=>{set(v);paint()};row.appendChild(b);
  });
  paint();
}
bindIcons('#modeRow',[['jigsaw','🧩','Rompecabezas'],['slide',gridSvg(3,true),'Deslizante']],()=>mode,v=>{mode=v;save('mode',v)});
bindIcons('#sizeRow',[2,3,4,5,6].map(n=>[n,gridSvg(n,false),n+'x'+n]),()=>N,v=>{N=+v;save('N',v)});
function paintSound(){$('#soundBtn').textContent=$('#soundBtn2').textContent=sound?'🔊':'🔇'}
function toggleSound(){sound=!sound;save('sound',sound?'1':'0');paintSound();if(sound)popSound()}
$('#soundBtn').onclick=$('#soundBtn2').onclick=toggleSound;

/* ---------- Sonido y vibración ---------- */
let AC=null;
function beep(freq,dur,type,vol,delay){
  if(!sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'triangle';o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
function popSound(){beep(660,.12,'triangle',.15,0);beep(990,.1,'triangle',.1,.06);if(sound){try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}}}
function fanfare(){[523,659,784,1047].forEach((f,i)=>beep(f,.3,'triangle',.16,i*.14))}
paintSound();

/* ---------- Geometría de las piezas ----------
   Cada borde interior tiene UNA sola curva (en coordenadas del tablero).
   La pieza de un lado la recorre en un sentido y la del otro en sentido contrario,
   así lengüeta y hueco encajan exactamente. */
const TT=0.1;
const EDGE=[[0,0],[0.2,0],[0.5,-TT],[0.5-TT,TT],[0.5-2*TT,3*TT],[0.5+2*TT,3*TT],[0.5+TT,TT],[0.5,-TT],[0.8,0],[1,0]];
function newEdges(n){
  const rnd=()=>Math.random()<.5?1:-1,H=[],V=[];
  for(let r=0;r<n;r++){H.push([]);V.push([]);for(let c=0;c<n;c++){H[r].push(rnd());V[r].push(rnd())}}
  return {H,V};
}
/* 10 puntos del borde. 'H': línea inferior de (r,c), de izq. a der.; saliente hacia abajo si s=1.
   'V': línea derecha de (r,c), de arriba a abajo; saliente hacia la derecha si s=1. */
function edgePts(kind,r,c,T,s){
  return EDGE.map(([l,w])=>kind==='H'
    ?[c*T+l*T,(r+1)*T+s*w*T]
    :[(c+1)*T+s*w*T,r*T+l*T]);
}
function addEdge(p,q,rev,X,Y){
  const P=rev?q.slice().reverse():q;
  for(let i=0;i<9;i+=3)
    p.bezierCurveTo(X(P[i+1][0]),Y(P[i+1][1]),X(P[i+2][0]),Y(P[i+2][1]),X(P[i+3][0]),Y(P[i+3][1]));
}
/* contorno de la pieza (r,c); (ox,oy) = punto del tablero que será el (0,0) del dibujo */
function piecePath(r,c,n,T,E,ox,oy){
  const p=new Path2D(),X=x=>x-ox,Y=y=>y-oy;
  const x0=c*T,y0=r*T,x1=x0+T,y1=y0+T;
  p.moveTo(X(x0),Y(y0));
  if(r>0)addEdge(p,edgePts('H',r-1,c,T,E.H[r-1][c]),false,X,Y);else p.lineTo(X(x1),Y(y0));
  if(c<n-1)addEdge(p,edgePts('V',r,c,T,E.V[r][c]),false,X,Y);else p.lineTo(X(x1),Y(y1));
  if(r<n-1)addEdge(p,edgePts('H',r,c,T,E.H[r][c]),true,X,Y);else p.lineTo(X(x0),Y(y1));
  if(c>0)addEdge(p,edgePts('V',r,c-1,T,E.V[r][c-1]),true,X,Y);else p.lineTo(X(x0),Y(y0));
  p.closePath();
  return p;
}

/* ---------- Juego ---------- */
const board=$('#board'),stage=$('#stage'),hitCtx=document.createElement('canvas').getContext('2d');
let S=0,T=0,PAD=0,P=0,L=null,curImg=null,curUrl='';
let tiles=[],order=[],empty=-1,done=false;
let jig=null,drag=null,zTop=10;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function setBar(f){$('#bar i').style.width=Math.round(f*100)+'%'}

function squareCanvas(img){
  const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,s=Math.min(w,h),out=Math.min(1024,s);
  const c=document.createElement('canvas');c.width=c.height=out;
  c.getContext('2d').drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,out,out);
  return c;
}
function solveS(a,c){return Math.floor((-1+Math.sqrt(1+4*a*c))/(2*a))}
function computeLayout(){
  const r=stage.getBoundingClientRect(),W=Math.floor(r.width),H=Math.floor(r.height);
  if(mode==='slide'){
    let s=Math.min(W,H,720);s-=s%N;
    return {W,H,S:s,bx:Math.floor((W-s)/2),by:Math.floor((H-s)/2)};
  }
  const gap=12,k=0.85;let s,bx,by,tray;
  if(W<=H*1.1){            /* vertical: tablero arriba, piezas debajo */
    s=Math.min(solveS(k/W,H-gap),W,520);s-=s%N;
    bx=Math.floor((W-s)/2);by=0;tray={x:0,y:s+gap,w:W,h:H-s-gap};
  }else{                   /* horizontal: tablero a la izquierda, piezas a la derecha */
    s=Math.min(solveS(k/H,W-gap),H,520);s-=s%N;
    bx=0;by=Math.floor((H-s)/2);tray={x:s+gap,y:0,w:W-s-gap,h:H};
  }
  return {W,H,S:s,bx,by,tray};
}
function applyBoard(){board.style.width=board.style.height=S+'px';board.style.left=L.bx+'px';board.style.top=L.by+'px'}
function clearStage(){
  stage.querySelectorAll('.piece').forEach(x=>x.remove());
  board.querySelectorAll('.tile,#ghost').forEach(x=>x.remove());
}

/* --- Rompecabezas --- */
function movePiece(p,x,y){
  x=Math.max(-PAD,Math.min(L.W-T-PAD,x));y=Math.max(-PAD,Math.min(L.H-T-PAD,y));
  p.x=x;p.y=y;p.cv.style.transform='translate('+x+'px,'+y+'px)';
}
function makePiece(r,c){
  const cv=document.createElement('canvas');
  cv.width=cv.height=Math.round(P*DPR);cv.style.width=cv.style.height=P+'px';
  cv.className='piece';
  const g=cv.getContext('2d');g.scale(DPR,DPR);
  const path=piecePath(r,c,N,T,jig.E,c*T-PAD,r*T-PAD);
  g.save();g.clip(path);
  g.drawImage(curImg,-(c*T-PAD),-(r*T-PAD),S,S);
  g.lineWidth=3;g.strokeStyle='rgba(255,255,255,.28)';g.stroke(path);   /* brillo interior */
  g.restore();
  g.lineWidth=1.2;g.strokeStyle='rgba(0,0,0,.5)';g.stroke(path);          /* contorno */
  const id=r*N+c;
  cv.dataset.id=id;cv.dataset.tx=L.bx+c*T-PAD;cv.dataset.ty=L.by+r*T-PAD;
  return {id,r,c,cv,path,x:0,y:0,z:0,placed:false,tx:L.bx+c*T-PAD,ty:L.by+r*T-PAD};
}
function scatter(list){
  const tr=L.tray,n=list.length;if(!n)return;
  const cols=Math.max(1,Math.round(Math.sqrt(n*tr.w/tr.h))),rows=Math.ceil(n/cols);
  const cw=tr.w/cols,ch=tr.h/rows;
  const cells=[...Array(cols*rows).keys()].sort(()=>Math.random()-.5);
  list.forEach((p,i)=>{
    const cell=cells[i],cx=tr.x+((cell%cols)+.5)*cw,cy=tr.y+(Math.floor(cell/cols)+.5)*ch;
    const jx=(Math.random()-.5)*Math.min(cw*.3,T*.5),jy=(Math.random()-.5)*Math.min(ch*.3,T*.5);
    movePiece(p,cx+jx-P/2,cy+jy-P/2);
    p.z=++zTop;p.cv.style.zIndex=p.z;
  });
}
function buildJigsawView(){
  clearStage();
  L=computeLayout();S=L.S;T=S/N;PAD=Math.ceil(T*0.28)+2;P=T+2*PAD;applyBoard();
  /* guía tenue de la imagen y de las piezas dentro del tablero */
  const gh=document.createElement('canvas');gh.id='ghost';
  gh.width=gh.height=Math.round(S*DPR);gh.style.width=gh.style.height=S+'px';
  const g=gh.getContext('2d');g.scale(DPR,DPR);
  g.globalAlpha=.2;g.drawImage(curImg,0,0,S,S);g.globalAlpha=1;
  g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=1.5;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)g.stroke(piecePath(r,c,N,T,jig.E,0,0));
  board.insertBefore(gh,board.firstChild);
  jig.pieces=[];const loose=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const p=makePiece(r,c);jig.pieces.push(p);stage.appendChild(p.cv);
    if(jig.placed.has(p.id)){p.placed=true;p.cv.classList.add('placed');p.cv.style.zIndex=1;movePiece(p,p.tx,p.ty)}
    else loose.push(p);
  }
  scatter(loose);
  updateBar();
}
function pickPiece(x,y){
  let best=null;
  for(const p of jig.pieces){
    if(p.placed)continue;
    const lx=x-p.x,ly=y-p.y;
    if(lx<0||ly<0||lx>P||ly>P||!hitCtx.isPointInPath(p.path,lx,ly))continue;
    if(!best||p.z>best.z)best=p;
  }
  if(best)return best;
  /* margen para dedos: la pieza suelta más cercana */
  let d=T*.55;
  for(const p of jig.pieces){
    if(p.placed)continue;
    const k=Math.hypot(x-(p.x+P/2),y-(p.y+P/2));
    if(k<d){d=k;best=p}
  }
  return best;
}
function pt(e){const r=stage.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
stage.addEventListener('pointerdown',e=>{
  if(mode!=='jigsaw'||done||!jig||drag)return;
  const [x,y]=pt(e),p=pickPiece(x,y);if(!p)return;
  p.z=++zTop;p.cv.style.zIndex=p.z;p.cv.classList.add('drag');
  drag={p,dx:x-p.x,dy:y-p.y};
  try{stage.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;const [x,y]=pt(e);movePiece(drag.p,x-drag.dx,y-drag.dy);
});
function endDrag(snapCheck){
  if(!drag)return;const p=drag.p;drag=null;p.cv.classList.remove('drag');
  if(snapCheck&&Math.hypot(p.x-p.tx,p.y-p.ty)<=T*.4){
    p.cv.classList.add('snap');movePiece(p,p.tx,p.ty);
    p.placed=true;p.cv.classList.add('placed');p.cv.style.zIndex=1;
    setTimeout(()=>p.cv.classList.remove('snap'),160);
    jig.placed.add(p.id);popSound();updateBar();
    if(jig.placed.size===N*N)finish();
  }
}
stage.addEventListener('pointerup',()=>endDrag(true));
stage.addEventListener('pointercancel',()=>endDrag(false));
function finish(){
  done=true;fanfare();
  setTimeout(()=>$('#win').classList.add('on'),600);
}
function updateBar(){
  if(mode==='jigsaw'&&jig)setBar(jig.placed.size/(N*N));
  else if(mode==='slide'&&order.length){
    let ok=0;order.forEach((v,i)=>{if(v===i&&v!==N*N-1)ok++});setBar(ok/(N*N-1));
  }else setBar(0);
}

/* --- Deslizante --- */
function neighbors(p){
  const x=p%N,y=Math.floor(p/N),a=[];
  if(x>0)a.push(p-1);if(x<N-1)a.push(p+1);if(y>0)a.push(p-N);if(y<N-1)a.push(p+N);return a;
}
function buildSlideView(){
  clearStage();
  L=computeLayout();S=L.S;T=S/N;applyBoard();
  const img='url('+curUrl+')';tiles=[];
  for(let slot=0;slot<N*N;slot++){
    const piece=order[slot],el=document.createElement('div');el.className='tile';
    el.style.width=el.style.height=T+'px';
    el.style.backgroundImage=img;el.style.backgroundSize=S+'px '+S+'px';
    el.style.backgroundPosition='-'+((piece%N)*T)+'px -'+(Math.floor(piece/N)*T)+'px';
    tiles[piece]=el;board.appendChild(el);
    if(piece===N*N-1&&!done)el.classList.add('empty');
  }
  order.forEach((piece,slot)=>{const el=tiles[piece];
    el.style.left=(slot%N)*T+'px';el.style.top=Math.floor(slot/N)*T+'px'});
  updateBar();
}
function slotAt(cx,cy){
  const r=board.getBoundingClientRect(),x=Math.floor((cx-r.left)/T),y=Math.floor((cy-r.top)/T);
  if(x<0||y<0||x>=N||y>=N)return -1;return y*N+x;
}
function afterSlideMove(){
  order.forEach((piece,slot)=>{const el=tiles[piece];
    el.style.left=(slot%N)*T+'px';el.style.top=Math.floor(slot/N)*T+'px'});
  popSound();updateBar();
  if(order.every((v,i)=>v===i)){tiles[N*N-1].classList.remove('empty');finish()}
}
board.addEventListener('pointerdown',e=>{
  if(mode!=='slide'||done)return;
  const slot=slotAt(e.clientX,e.clientY);if(slot<0)return;
  if(neighbors(empty).includes(slot)){
    order[empty]=order[slot];order[slot]=N*N-1;empty=slot;afterSlideMove();
  }
});

/* --- Arranque / reinicio --- */
function newShuffle(){
  if(!curImg)return;
  done=false;drag=null;jig=null;$('#win').classList.remove('on');
  if(mode==='jigsaw'){
    order=[];
    jig={E:newEdges(N),placed:new Set(),pieces:[]};
    buildJigsawView();
  }else{
    const n=N*N;order=[...Array(n).keys()];empty=n-1;let last=-1;
    for(let k=0;k<n*30;k++){
      const nb=neighbors(empty).filter(x=>x!==last),m=nb[Math.floor(Math.random()*nb.length)];
      order[empty]=order[m];order[m]=n-1;last=empty;empty=m;
    }
    if(order.every((v,i)=>v===i))return newShuffle();
    buildSlideView();
  }
}
async function startGame(){
  if(!images.length){toast('☁️ ⬇');return}
  show('game');$('#win').classList.remove('on');
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    curImg=squareCanvas(await loadImg(images[selected].data));
    curUrl=curImg.toDataURL('image/jpeg',.9);
  }catch(e){toast('❌');show('home');return}
  $('#preview').style.backgroundImage='url('+curUrl+')';
  newShuffle();
}
let rz;
window.addEventListener('resize',()=>{
  clearTimeout(rz);
  rz=setTimeout(()=>{
    if(!$('#game').classList.contains('on')||!curImg)return;
    drag=null;
    if(mode==='jigsaw'&&jig)buildJigsawView();else if(mode==='slide'&&order.length)buildSlideView();
  },250);
});

/* botones */
$('#playBtn').onclick=startGame;
$('#shuffleBtn').onclick=newShuffle;
$('#againBtn').onclick=newShuffle;
$('#menuBtn').onclick=()=>show('home');
$('#backBtn').onclick=()=>show('home');
const pv=$('#preview'),peek=$('#peekBtn');
const on=()=>pv.style.display='block',off=()=>pv.style.display='none';
peek.addEventListener('pointerdown',on);peek.addEventListener('pointerup',off);
peek.addEventListener('pointerleave',off);peek.addEventListener('pointercancel',off);

/* botón atrás de Android */
try{
  const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(A)A.addListener('backButton',()=>{
    if($('#game').classList.contains('on'))show('home');else A.exitApp();
  });
}catch(e){}

loadImages();
})();
</script>

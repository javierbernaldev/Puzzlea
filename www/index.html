<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1f3b">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Puzzlea</title>
<style>
:root{--bg:#1b1f3b;--card:#262b52;--card2:#323974;--ink:#f4f5ff;--mute:#9aa0d0;--acc:#ffb703;--acc2:#4cc9f0;--ok:#3ddc84}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:14px;gap:10px}
.screen.on{display:flex}
button{font:inherit;border:0;border-radius:16px;background:var(--card);color:var(--ink);font-weight:700;padding:12px 16px;transition:transform .08s}
button:active{transform:scale(.93)}
button:disabled{opacity:.6}
.ib{width:50px;height:50px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:24px;line-height:1;flex:none}
.ib svg{display:block}

/* inicio */
.top{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top{gap:6px}
.top .ib{width:44px;height:44px;font-size:21px}
@media(max-width:430px){.top h1 .nm{display:none}}
#gallery{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:start;padding:2px}
@media(min-width:560px){#gallery{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){#gallery{grid-template-columns:repeat(5,1fr)}}
.thumb{position:relative;aspect-ratio:1;border-radius:18px;background:var(--card) center/cover no-repeat;background-origin:border-box;border:4px solid transparent}
.thumb.sel{border-color:var(--acc);box-shadow:0 0 0 3px #ffb70055}
.thumb.sel::after{content:"✓";position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#1b1f3b;display:grid;place-items:center;font-weight:900}
.add{display:grid;place-items:center;font-size:44px;color:var(--mute);border:3px dashed var(--mute);background:transparent}
.empty{grid-column:1/-1;text-align:center;font-size:64px;padding:30px 0;opacity:.8}
.bottom{display:flex;flex-direction:column;gap:8px}
.row1{display:flex;align-items:center;gap:8px}
.row1 .seg{flex:1;justify-content:flex-start}
.seg{display:flex;gap:8px}
.seg button{flex:1;max-width:76px;height:46px;padding:0;display:grid;place-items:center;background:var(--card2);font-size:22px;font-weight:800;color:var(--ink)}
#modeRow button{flex:none;width:52px}
.seg button.sel{background:var(--acc);color:#1b1f3b}
#playBtn{width:96px;height:52px;border-radius:26px;font-size:28px;background:var(--ok);color:#0b3d1f;padding:0 0 0 4px;box-shadow:0 5px 0 #1f9a55;flex:none}
#playBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #1f9a55}

/* juego */
#hud{display:flex;align-items:center;gap:10px}
#bar{flex:1;height:18px;border-radius:9px;background:var(--card);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--ok));border-radius:9px;transition:width .25s}
#stage{position:relative;flex:1;min-height:0;touch-action:none;isolation:isolate}
#board{position:absolute;background:#0e1126;border-radius:6px;touch-action:none;overflow:hidden;box-shadow:inset 0 0 0 2px #2c3270}
#ghost{position:absolute;left:0;top:0;pointer-events:none}
#preview{position:absolute;inset:0;background-size:100% 100%;display:none;z-index:100000}
.piece{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.piece.drag{filter:drop-shadow(0 10px 12px rgba(0,0,0,.5))}
.piece.placed{filter:none}
.piece.snap{transition:transform .12s ease-out}
.tile{position:absolute;background-repeat:no-repeat;transition:left .12s,top .12s;outline:1px solid rgba(0,0,0,.35);outline-offset:-1px}
.tile.empty{visibility:hidden}
#win{position:absolute;inset:0;background:rgba(10,12,30,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:20}
#win.on{display:flex}
#win .big{font-size:96px;line-height:1;animation:pop .6s ease-out}
#win .row{display:flex;gap:22px}
#win .ib{width:76px;height:76px;font-size:38px}
#win .go{background:var(--ok);color:#0b3d1f}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg);opacity:0}70%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1);opacity:1}}
#toast{pointer-events:none;max-width:86vw;text-align:center;position:fixed;left:50%;top:76px;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:20px;display:none;z-index:99;font-size:15px}
#gallery.del .thumb:not(.add){animation:wob .5s infinite alternate}
#gallery.ord .thumb.pick{transform:scale(.93);border-color:var(--acc2);box-shadow:0 0 0 4px #4cc9f055}
#gallery.ord .thumb:not(.pick){border-style:dashed;border-color:#ffffff44}
.thumb .n{position:absolute;left:6px;top:6px;min-width:26px;height:26px;border-radius:13px;background:#000a;color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;padding:0 6px}
.thumb .x{position:absolute;right:-6px;top:-6px;width:40px;height:40px;border-radius:50%;background:#e5484d;color:#fff;font-size:20px;padding:0;display:grid;place-items:center;box-shadow:0 2px 6px #0008}
.thumb .lock{position:absolute;right:6px;top:6px;font-size:20px;opacity:.7}
#tools{display:none;justify-content:center;gap:14px;background:var(--card);border-radius:20px;padding:8px}
#tools.on{display:flex}
#homeBtn{display:none;align-self:center;width:96px;height:56px;border-radius:28px;font-size:30px;background:var(--card2);margin-top:auto}
#home.tmode .bottom,#home.tmode #toolBtn{display:none}
#home.tmode #homeBtn{display:grid}
#tools .ib[hidden]{display:none}
#tools .ib{width:56px;height:56px;font-size:26px;background:var(--card2)}
#delBtn.on,#ordBtn.on,#upBtn.on{background:var(--ok);color:#0b3d1f}
@keyframes wob{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
#pin{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:90}
#pin.on{display:flex}
#pin .box{position:relative;background:var(--card);border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
#pin .dots{display:flex;gap:12px;height:22px}
#pin .dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--mute)}
#pin .dots i.f{background:var(--acc);border-color:var(--acc)}
#pin .keys{display:grid;grid-template-columns:repeat(3,64px);gap:10px}
#pin #pinX{position:absolute;right:-12px;top:-12px;width:44px;height:44px;border-radius:50%;background:#e5484d;color:#fff;font-size:20px;padding:0;display:grid;place-items:center;box-shadow:0 3px 8px #0009}
#gate{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100;padding:24px}
#gate.on{display:flex}
#gate .ico{font-size:72px}
#gate .row{display:flex;gap:10px;width:min(420px,100%)}
#gate input{flex:1;min-width:0;font:inherit;font-size:20px;padding:14px 16px;border-radius:16px;border:3px solid var(--card2);background:var(--card);color:var(--ink)}
#gate input:focus{outline:0;border-color:var(--acc)}
#gate button{width:56px;padding:0;font-size:24px;background:var(--card2)}
#gate #gateGo{background:var(--acc);color:#1b1f3b}
#gate.bad .row{animation:shake .35s}
#gate.busy .row{opacity:.6;pointer-events:none}
#pin.busy .box{opacity:.6;pointer-events:none}
#pin .keys button{height:64px;font-size:26px;background:#ffffff18;padding:0}
#pin.bad .box{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
</style>
</head>
<body>

<div id="home" class="screen on">
  <div class="top">
    <h1>🧩<span class="nm"> Puzzlea</span></h1>
    <button id="toolBtn" class="ib" aria-label="Herramientas">🔧</button>
    <button id="soundBtn" class="ib" aria-label="Sonido">🔊</button>
  </div>
  <div id="tools" class="tools">
    <button id="syncBtn" class="ib" aria-label="Descargar">⬇️</button>
    <button id="addBtn" class="ib" aria-label="Añadir foto">➕</button>
    <button id="upBtn" class="ib" aria-label="Subir a la nube" hidden>⬆️</button>
    <button id="ordBtn" class="ib" aria-label="Ordenar">↔️</button>
    <button id="delBtn" class="ib" aria-label="Borrar fotos">🗑️</button>
  </div>
  <div id="gallery"></div>
  <div class="bottom">
    <div class="row1">
      <div class="seg" id="modeRow"></div>
      <button id="playBtn" class="ib" aria-label="Jugar">▶</button>
    </div>
    <div class="seg" id="sizeRow"></div>
  </div>
  <button id="homeBtn" class="ib" aria-label="Inicio">🏠</button>
  <div id="pin"><div class="box">
    <button id="pinX" aria-label="Cerrar">✖</button>
    <div style="font-size:34px">🔒</div>
    <div class="dots" id="pinDots"></div>
    <div class="keys">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <span></span><button>0</button><button data-k="b" aria-label="Borrar">⌫</button>
    </div>
  </div></div>
  <input type="file" id="file" accept="image/*" multiple hidden>
</div>

<div id="gate">
  <div class="ico">🔑</div>
  <form class="row" id="gateForm" autocomplete="off">
    <input id="gatePass" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Contraseña">
    <button type="button" id="gateEye" aria-label="Mostrar">👁</button>
    <button type="submit" id="gateGo" aria-label="Entrar">➡️</button>
  </form>
</div>

<div id="game" class="screen">
  <div id="hud">
    <button id="backBtn" class="ib" aria-label="Inicio">🏠</button>
    <div id="bar"><i></i></div>
    <button id="peekBtn" class="ib" aria-label="Ver imagen">👁</button>
    <button id="soundBtn2" class="ib" aria-label="Sonido">🔊</button>
    <button id="shuffleBtn" class="ib" aria-label="Reiniciar">↻</button>
  </div>
  <div id="stage"><div id="board"><div id="preview"></div></div></div>
  <div id="win">
    <div class="big">🎉</div>
    <div class="row">
      <button id="againBtn" class="ib go" aria-label="Otra vez">↻</button>
      <button id="menuBtn" class="ib" aria-label="Inicio">🏠</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
/* Servidor de imágenes: fijo, no se puede cambiar desde la app */
const DPR=Math.min(window.devicePixelRatio||1,2.5);
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());

/* ---------- Servidor de puzzles (S3) · ver server/README-S3.md ---------- */
const UPLOAD_URL='https://geqskc34bnqvjw5abnk7mqbnmu0ykdfy.lambda-url.eu-west-1.on.aws/';                                      /* ← pega aquí la Function URL de la Lambda (vacío = modo sin servidor: sin contraseña de entrada, ➕ guarda solo en el dispositivo y el PIN se comprueba con PIN_HASH) */
/* Modo sin servidor (UPLOAD_URL vacío): la clave se comprueba contra esta huella.
   Con UPLOAD_URL puesto, la clave la comprueba la Lambda: borra el valor de PIN_HASH (déjalo '') y la clave deja de estar en el HTML. */
const PIN_HASH='';

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('imagen no válida'));i.src=src});

/* ---------- Almacén de imágenes descargadas/subidas (IndexedDB) ---------- */
const DB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('puzzles',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('imgs',{keyPath:'id',autoIncrement:true});
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const q=fn(db.transaction('imgs',mode).objectStore('imgs'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  all(){return this.run('readonly',s=>s.getAll())},
  add(data,src,etag){return this.run('readwrite',s=>s.add({data,src,etag}))},
  del(id){return this.run('readwrite',s=>s.delete(id))},
  clear(){return this.run('readwrite',s=>s.clear())}
};

/* ---------- Estado y ajustes (se guardan de una vez para otra) ---------- */
let galMode=null, pick=-1;   /* galMode: null | 'del' | 'ord' | 'up' */
let images=[], selected=0, mode='jigsaw', N=3, sound=true;
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
try{
  if(localStorage.getItem('mode')==='slide')mode='slide';
  const n=+localStorage.getItem('N');if(n>=2&&n<=6)N=n;
  sound=localStorage.getItem('sound')!=='0';
}catch(e){}

/* puzzles por defecto: los de la carpeta images/ del repositorio, empaquetados en la app */
async function loadBuiltin(){
  try{
    const r=await fetch('images/manifest.json',{cache:'no-store'});
    if(!r.ok)return [];
    return (await r.json()).map(f=>({id:null,builtin:true,key:'b:'+f,data:'images/'+encodeURIComponent(f)}));
  }catch(e){return []}
}
/* Orden de las fotos: se guarda como lista de claves ('b:fichero' del repo, 'd:id' de las añadidas) */
const keyOf=im=>im.key||('d:'+im.id);
function getOrder(){try{return JSON.parse(localStorage.getItem('order')||'[]')}catch(e){return []}}
function saveOrder(){save('order',JSON.stringify(images.map(keyOf)))}
async function loadImages(){
  let saved=[];try{saved=await DB.all()}catch(e){}
  const keepKey=images[selected]?keyOf(images[selected]):null;
  images=(await loadBuiltin()).concat(saved);
  const ord=getOrder(),pos=k=>{const i=ord.indexOf(k);return i<0?1e9:i};
  images=images.map((im,i)=>[im,i]).sort((a,b)=>pos(keyOf(a[0]))-pos(keyOf(b[0]))||a[1]-b[1]).map(x=>x[0]);
  const si=keepKey?images.findIndex(im=>keyOf(im)===keepKey):-1;
  selected=si>=0?si:0;
  renderGallery();
}
function renderGallery(){
  const g=$('#gallery');g.innerHTML='';g.classList.toggle('del',galMode==='del');g.classList.toggle('ord',galMode==='ord');g.classList.toggle('del',galMode==='del'||galMode==='up');
  if(!images.length){const e=document.createElement('div');e.className='empty';e.textContent='🖼️';g.appendChild(e)}
  images.forEach((im,i)=>{
    const d=document.createElement('div');d.className='thumb'+(galMode===null&&i===selected?' sel':'')+(galMode==='ord'&&i===pick?' pick':'');
    d.style.backgroundImage='url("'+im.data+'")';
    if(galMode==='del'){
      if(im.builtin){const l=document.createElement('span');l.className='lock';l.textContent='🔒';d.appendChild(l)}
      else{const x=document.createElement('button');x.className='x';x.textContent='✖';x.setAttribute('aria-label','Borrar');
        x.onclick=async e=>{e.stopPropagation();try{await DB.del(im.id);if(im.src)hideKey(im.src)}catch(err){toast('❌');return}
          await loadImages()};
        d.appendChild(x)}
    }else if(galMode==='up'){
      if(im.builtin||im.src||(im.id!=null&&cloudHas(im.id))){const l=document.createElement('span');l.className='lock';l.textContent=im.builtin?'🔒':'☁️';d.appendChild(l)}
      else{const x=document.createElement('button');x.className='x';x.textContent='⬆️';x.setAttribute('aria-label','Subir');
        x.style.background='var(--ok)';
        x.onclick=async e=>{e.stopPropagation();x.textContent='⏳';x.disabled=true;
          try{const dup=await uploadOne(im.data);await DB.del(im.id);await syncWarehouse(true);await prepUp();renderGallery();toast(dup?'☁️':'⬆ 1')}
          catch(err){toast(netError(err));renderGallery()}};
        d.appendChild(x)}
    }else if(galMode==='ord'){
      const n=document.createElement('span');n.className='n';n.textContent=i+1;d.appendChild(n);
      d.onclick=()=>{
        if(pick<0)pick=i;
        else if(pick===i)pick=-1;
        else{const keep=keyOf(images[selected]);const [m]=images.splice(pick,1);images.splice(i,0,m);pick=-1;
          selected=images.findIndex(x=>keyOf(x)===keep);saveOrder()}
        renderGallery();
      };
    }else d.onclick=()=>{selected=i;renderGallery()};
    g.appendChild(d);
  });
}

/* Clave de las herramientas. Con servidor, la comprueba la Lambda (la clave no está en el HTML).
   Sin red se usa la huella guardada en este dispositivo tras una comprobación correcta. */
let pinVal='',pinCb=null,sessionPin='';
function hashPin(s){let h1=0xdeadbeef^0,h2=0x41c6ce57^0;s='puzzlea|'+s;
  for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
/* Todo lo privado pasa por la Lambda. La sesión (token) vive solo en memoria: al cerrar la app hay que volver a entrar. */
let token='';
async function api(body,ms){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms||15000);
  try{
    const r=await fetch(UPLOAD_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({token},body)),signal:ctl.signal});
    if(r.status===401){token='';showGate(true)}
    return r;
  }finally{clearTimeout(t)}
}
async function checkPin(pin){
  if(UPLOAD_URL){
    try{
      const r=await api({action:'check',pin},9000);
      if(r.ok){save('pinc',hashPin(pin));return true}
      if(r.status===403||r.status===401)return false;
    }catch(e){}
    let c='';try{c=localStorage.getItem('pinc')||''}catch(e){}
    return !!c&&hashPin(pin)===c;                      /* sin red */
  }
  return !!PIN_HASH&&hashPin(pin)===PIN_HASH;
}
function pinDots(){
  const box=$('#pinDots');
  while(box.children.length<4)box.appendChild(document.createElement('i'));
  [...box.children].forEach((d,i)=>d.classList.toggle('f',i<pinVal.length));
}
function askPin(cb){pinCb=cb;pinVal='';pinDots();$('#pin').classList.add('on')}
function pinBad(){const p=$('#pin');p.classList.add('bad');setTimeout(()=>{p.classList.remove('bad');pinVal='';pinDots()},400)}
async function submitPin(){
  const p=$('#pin');p.classList.add('busy');
  let ok=false;try{ok=await checkPin(pinVal)}catch(e){}
  p.classList.remove('busy');
  if(ok){sessionPin=pinVal;p.classList.remove('on');pinVal='';const cb=pinCb;pinCb=null;if(cb)cb()}
  else pinBad();
}
document.querySelectorAll('#pin .keys button').forEach(b=>b.onclick=()=>{
  if(pinVal.length>=4||$('#pin').classList.contains('busy'))return;
  const k=b.dataset.k;
  if(k==='b'){pinVal=pinVal.slice(0,-1);pinDots();return}
  pinVal+=b.textContent;pinDots();
  if(pinVal.length===4)submitPin();                 /* se comprueba al escribir el 4º dígito */
});
const closePin=()=>{$('#pin').classList.remove('on');pinVal='';pinCb=null};
$('#pinX').onclick=closePin;
$('#pin').addEventListener('pointerdown',e=>{if(e.target===$('#pin'))closePin()});   /* tocar fuera también cierra */

/* 🔧 Herramientas (con clave): descargar, añadir, ordenar y borrar, ya sin más claves */
function setTools(on){
  $('#tools').classList.toggle('on',on);$('#home').classList.toggle('tmode',on);
  if(!on){setGal(null);sessionPin=''}
}
$('#homeBtn').onclick=()=>setTools(false);
$('#toolBtn').onclick=()=>askPin(()=>setTools(true));

/* ➕ añadir, ↔️ ordenar, 🗑️ borrar. Solo se borran las fotos añadidas; las del repo (🔒) no. */
/* Huella (SHA-256) del contenido: es el nombre de la foto en S3, así que la misma foto nunca se sube dos veces */
async function sha(dataUrl){
  const buf=await (await fetch(dataUrl)).arrayBuffer();
  if(window.crypto&&crypto.subtle)return [...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(b=>b.toString(16).padStart(2,'0')).join('');
  let h='';for(let k=0;k<4;k++){let a=0x9e3779b9^k,b=0x85ebca6b+k;const u=new Uint8Array(buf);
    for(let i=0;i<u.length;i++){a=Math.imul(a^u[i],2654435761);b=Math.imul(b^u[i],1597334677);a^=b>>>15}
    h+=((a>>>0).toString(16).padStart(8,'0')+(b>>>0).toString(16).padStart(8,'0'))}

/* recorta al cuadrado y reduce a 1024 */
function fileToSquare(file){
  /* Recorta al cuadrado. Si el navegador dibuja negro, prueba otros métodos de lectura antes de rendirse. */
  const square=(src,w,h)=>{
    const s=Math.min(w,h),out=Math.min(1024,s);
    const c=document.createElement('canvas');c.width=c.height=out;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,out,out);   /* fondo blanco: el JPEG no tiene transparencia y saldría negro */
    x.drawImage(src,(w-s)/2,(h-s)/2,s,s,0,0,out,out);
    const d=x.getImageData(0,0,out,out).data;let mx=0;for(let k=0;k<d.length;k+=4*37)mx=Math.max(mx,d[k],d[k+1],d[k+2]);
    return mx<12?null:c.toDataURL('image/jpeg',.88);
  };
  const viaImg=()=>new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{try{res({out:square(img,img.naturalWidth,img.naturalHeight),w:img.naturalWidth,h:img.naturalHeight})}catch(e){rej(e)}finally{URL.revokeObjectURL(url)}};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('imagen no válida'))};
    img.src=url;
  });
  return (async()=>{
    const r=await viaImg();
    if(r.out)return r.out;
    if(window.createImageBitmap){                       /* otra vía de decodificación (y reducida si la foto es enorme) */
      for(const opt of [undefined,{resizeWidth:r.w>r.h?undefined:1024,resizeHeight:r.w>r.h?1024:undefined,resizeQuality:'high'}]){
        try{const bm=await (opt?createImageBitmap(file,opt):createImageBitmap(file));const o=square(bm,bm.width,bm.height);if(bm.close)bm.close();if(o)return o}catch(e){}
      }
    }
    try{                                               /* última vía: leer el archivo entero y decodificarlo desde datos en memoria */
      const du=await new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=()=>ko(fr.error);fr.readAsDataURL(file)});
      const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('x'));i.src=du});
      const o=square(img,img.naturalWidth,img.naturalHeight);if(o)return o;
    }catch(e){}
    throw new Error('negra: '+(file.type||'?')+' '+r.w+'x'+r.h+' '+Math.round(file.size/1024)+'KB');
  })();
}

const IMG_RE=/\.(jpe?g|png|webp|gif|bmp|avif)$/i;
function b64Blob(b64,type){
  const bin=atob(b64),u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return new Blob([u8],{type});
}
async function httpGet(url,as){            /* as: 'text' | 'blob'. En la app (Android) usa la red nativa. */
  const H=NATIVE&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CapacitorHttp;
  if(H){
    let r;
    try{r=await H.request({url,method:'GET',responseType:as==='blob'?'blob':'text',connectTimeout:15000,readTimeout:60000})}
    catch(e){r=null}
    if(r){
      if(r.status<200||r.status>=300)throw new Error('HTTP '+r.status);
      if(as==='blob'){const h=r.headers||{};return b64Blob(r.data,h['Content-Type']||h['content-type']||'image/jpeg')}
      return typeof r.data==='string'?r.data:String(r.data);
    }
  }
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return as==='blob'?r.blob():r.text();
}
function netError(e){
  const m=String(e&&e.message||e);
  if(/^negra/.test(m))return '⬛ '+m;
  if(/HTTP 403/.test(m))return '🔒 403';
  if(/HTTP 404/.test(m))return '❓ 404';
  if(/HTTP \d+/.test(m))return '⚠️ '+m;
  return '📡 ✖';
}

/* Deja los puzzles descargados igual que la carpeta de S3: baja los nuevos o cambiados y quita los que ya no están.
   Las fotos propias (➕ sin servidor) y las del repo no se tocan. */
let syncing=false;
async function syncWarehouse(quiet){
  if(syncing)return;
  syncing=true;const btn=$('#syncBtn');btn.disabled=true;btn.textContent='⏳';
  try{
    const items=await listWarehouse();let lastErr='';
    const hidden=new Set(getHidden());
    const want=items.filter(i=>!hidden.has(i.key));
    const wantKeys=new Set(want.map(i=>i.key));
    const rows=(await DB.all()).filter(r=>r.src);
    const have=new Map(rows.map(r=>[r.src,r]));
    for(const r of rows)if(!wantKeys.has(r.src))await DB.del(r.id);
    let added=0,fail=0;
    for(const it of want){
      const cur=have.get(it.key);
      if(cur&&cur.etag===it.etag)continue;
      try{
        const blob=await httpGet(it.url,'blob');
        if(blob.size<200)throw new Error('vacía ('+blob.size+' B)');
        if(blob.type&&!/^image\//.test(blob.type))throw new Error('tipo '+blob.type);
        const data=await fileToSquare(blob);
        if(await isBlack(data))throw new Error('negra ('+blob.size+' B, '+(blob.type||'?')+')');
        if(cur)await DB.del(cur.id);
        await DB.add(data,it.key,it.etag);added++;
      }catch(e){fail++;lastErr=String(e&&e.message||e)}
    }
    await loadImages();
    if(!quiet)toast(fail?('⬇ '+added+'  ⚠️ '+fail+(lastErr?' · '+lastErr:'')):(added?'⬇ '+added:'✅'));
  }catch(e){
    if(!quiet)toast(netError(e)); else throw e;
  }finally{syncing=false;btn.disabled=false;btn.textContent='⬇️'}
}
async function uploadOne(dataUrl){
  if(await isBlack(dataUrl))throw new Error('negra: no se sube');      /* nunca subir una foto negra */
  /* 1) la Lambda comprueba la clave y devuelve un permiso de subida firmado (409 = ya estaba subida); 2) la foto va directa a S3 */
  const r=await api({action:'presign',pin:sessionPin,hash:await sha(dataUrl)},20000);
  if(r.status===409)return true;
  if(!r.ok)throw new Error('HTTP '+r.status);
  const p=await r.json();
  const fd=new FormData();Object.entries(p.fields).forEach(([k,v])=>fd.append(k,v));
  fd.append('file',await (await fetch(dataUrl)).blob());          /* el fichero va siempre el último */
  const u=await fetch(p.url,{method:'POST',body:fd});
  if(!u.ok)throw new Error('HTTP '+u.status);
  return false;
}

let AC=null;
function beep(freq,dur,type,vol,delay){

/* ---------- Geometría de las piezas ----------
   Cada borde interior tiene UNA sola curva (en coordenadas del tablero).
   La pieza de un lado la recorre en un sentido y la del otro en sentido contrario,
   así lengüeta y hueco encajan exactamente. */
const TT=0.1;
const EDGE=[[0,0],[0.2,0],[0.5,-TT],[0.5-TT,TT],[0.5-2*TT,3*TT],[0.5+2*TT,3*TT],[0.5+TT,TT],[0.5,-TT],[0.8,0],[1,0]];
function newEdges(n){
  const rnd=()=>Math.random()<.5?1:-1,H=[],V=[];
  for(let r=0;r<n;r++){H.push([]);V.push([]);for(let c=0;c<n;c++){H[r].push(rnd());V[r].push(rnd())}}
  return {H,V};
}
/* 10 puntos del borde. 'H': línea inferior de (r,c), de izq. a der.; saliente hacia abajo si s=1.
   'V': línea derecha de (r,c), de arriba a abajo; saliente hacia la derecha si s=1. */
function edgePts(kind,r,c,T,s){
  return EDGE.map(([l,w])=>kind==='H'
    ?[c*T+l*T,(r+1)*T+s*w*T]
    :[(c+1)*T+s*w*T,r*T+l*T]);
}
function addEdge(p,q,rev,X,Y){
  const P=rev?q.slice().reverse():q;
  for(let i=0;i<9;i+=3)
    p.bezierCurveTo(X(P[i+1][0]),Y(P[i+1][1]),X(P[i+2][0]),Y(P[i+2][1]),X(P[i+3][0]),Y(P[i+3][1]));
}
/* contorno de la pieza (r,c); (ox,oy) = punto del tablero que será el (0,0) del dibujo */
function piecePath(r,c,n,T,E,ox,oy){
  const p=new Path2D(),X=x=>x-ox,Y=y=>y-oy;
  const x0=c*T,y0=r*T,x1=x0+T,y1=y0+T;
  p.moveTo(X(x0),Y(y0));
  if(r>0)addEdge(p,edgePts('H',r-1,c,T,E.H[r-1][c]),false,X,Y);else p.lineTo(X(x1),Y(y0));
  if(c<n-1)addEdge(p,edgePts('V',r,c,T,E.V[r][c]),false,X,Y);else p.lineTo(X(x1),Y(y1));
  if(r<n-1)addEdge(p,edgePts('H',r,c,T,E.H[r][c]),true,X,Y);else p.lineTo(X(x0),Y(y1));
  if(c>0)addEdge(p,edgePts('V',r,c-1,T,E.V[r][c-1]),true,X,Y);else p.lineTo(X(x0),Y(y0));
  p.closePath();
  return p;
}

/* ---------- Juego ---------- */
const board=$('#board'),stage=$('#stage'),hitCtx=document.createElement('canvas').getContext('2d');
let S=0,T=0,PAD=0,P=0,L=null,curImg=null,curUrl='';
let tiles=[],order=[],empty=-1,done=false;
let jig=null,drag=null,zTop=10;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function setBar(f){$('#bar i').style.width=Math.round(f*100)+'%'}

function squareCanvas(img){
  const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,s=Math.min(w,h),out=Math.min(1024,s);
  const c=document.createElement('canvas');c.width=c.height=out;
  c.getContext('2d').drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,out,out);
  return c;
}
function solveS(a,c){return Math.floor((-1+Math.sqrt(1+4*a*c))/(2*a))}
function computeLayout(){
  const r=stage.getBoundingClientRect(),W=Math.floor(r.width),H=Math.floor(r.height);
  if(mode==='slide'){
    let s=Math.min(W,H,720);s-=s%N;
    return {W,H,S:s,bx:Math.floor((W-s)/2),by:Math.floor((H-s)/2)};
  }
  const gap=12,k=0.85;let s,bx,by,tray;
  if(W<=H*1.1){            /* vertical: tablero arriba, piezas debajo */
    s=Math.min(solveS(k/W,H-gap),W,520);s-=s%N;
    bx=Math.floor((W-s)/2);by=0;tray={x:0,y:s+gap,w:W,h:H-s-gap};
  }else{                   /* horizontal: tablero a la izquierda, piezas a la derecha */
    s=Math.min(solveS(k/H,W-gap),H,520);s-=s%N;
    bx=0;by=Math.floor((H-s)/2);tray={x:s+gap,y:0,w:W-s-gap,h:H};
  }
  return {W,H,S:s,bx,by,tray};
}
function applyBoard(){board.style.width=board.style.height=S+'px';board.style.left=L.bx+'px';board.style.top=L.by+'px'}

  board.querySelectorAll('.tile,#ghost').forEach(x=>x.remove());
}

/* --- Rompecabezas --- */
function movePiece(p,x,y){
  x=Math.max(-PAD,Math.min(L.W-T-PAD,x));y=Math.max(-PAD,Math.min(L.H-T-PAD,y));
  p.x=x;p.y=y;p.cv.style.transform='translate('+x+'px,'+y+'px)';
}
function makePiece(r,c){
  const cv=document.createElement('canvas');
  cv.width=cv.height=Math.round(P*DPR);cv.style.width=cv.style.height=P+'px';
  cv.className='piece';
  const g=cv.getContext('2d');g.scale(DPR,DPR);
  const path=piecePath(r,c,N,T,jig.E,c*T-PAD,r*T-PAD);
  g.save();g.clip(path);
  g.drawImage(curImg,-(c*T-PAD),-(r*T-PAD),S,S);
  g.lineWidth=3;g.strokeStyle='rgba(255,255,255,.28)';g.stroke(path);   /* brillo interior */
  g.restore();
  g.lineWidth=1.2;g.strokeStyle='rgba(0,0,0,.5)';g.stroke(path);          /* contorno */
  const id=r*N+c;
  cv.dataset.id=id;cv.dataset.tx=L.bx+c*T-PAD;cv.dataset.ty=L.by+r*T-PAD;
  return {id,r,c,cv,path,x:0,y:0,z:0,placed:false,tx:L.bx+c*T-PAD,ty:L.by+r*T-PAD};
}
function scatter(list){
  const tr=L.tray,n=list.length;if(!n)return;
  const cols=Math.max(1,Math.round(Math.sqrt(n*tr.w/tr.h))),rows=Math.ceil(n/cols);
  const cw=tr.w/cols,ch=tr.h/rows;
  const cells=[...Array(cols*rows).keys()].sort(()=>Math.random()-.5);
  list.forEach((p,i)=>{
    const cell=cells[i],cx=tr.x+((cell%cols)+.5)*cw,cy=tr.y+(Math.floor(cell/cols)+.5)*ch;
    const jx=(Math.random()-.5)*Math.min(cw*.3,T*.5),jy=(Math.random()-.5)*Math.min(ch*.3,T*.5);
    movePiece(p,cx+jx-P/2,cy+jy-P/2);
    p.z=++zTop;p.cv.style.zIndex=p.z;
  });
}
function buildJigsawView(){
  clearStage();
  L=computeLayout();S=L.S;T=S/N;PAD=Math.ceil(T*0.28)+2;P=T+2*PAD;applyBoard();
  /* guía tenue de la imagen y de las piezas dentro del tablero */
  const gh=document.createElement('canvas');gh.id='ghost';
  gh.width=gh.height=Math.round(S*DPR);gh.style.width=gh.style.height=S+'px';
  const g=gh.getContext('2d');g.scale(DPR,DPR);
  g.globalAlpha=.2;g.drawImage(curImg,0,0,S,S);g.globalAlpha=1;
  g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=1.5;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)g.stroke(piecePath(r,c,N,T,jig.E,0,0));
  board.insertBefore(gh,board.firstChild);
  jig.pieces=[];const loose=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const p=makePiece(r,c);jig.pieces.push(p);stage.appendChild(p.cv);
    if(jig.placed.has(p.id)){p.placed=true;p.cv.classList.add('placed');p.cv.style.zIndex=1;movePiece(p,p.tx,p.ty)}
    else loose.push(p);
  }
  scatter(loose);
  updateBar();
}
function pickPiece(x,y){
  let best=null;
  for(const p of jig.pieces){
    if(p.placed)continue;
    const lx=x-p.x,ly=y-p.y;
    if(lx<0||ly<0||lx>P||ly>P||!hitCtx.isPointInPath(p.path,lx,ly))continue;
    if(!best||p.z>best.z)best=p;
  }
  if(best)return best;
  /* margen para dedos: la pieza suelta más cercana */
  let d=T*.55;
  for(const p of jig.pieces){
    if(p.placed)continue;
    const k=Math.hypot(x-(p.x+P/2),y-(p.y+P/2));
    if(k<d){d=k;best=p}
  }
  return best;
}
function pt(e){const r=stage.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
stage.addEventListener('pointerdown',e=>{
  if(mode!=='jigsaw'||done||!jig||drag)return;
  const [x,y]=pt(e),p=pickPiece(x,y);if(!p)return;
  p.z=++zTop;p.cv.style.zIndex=p.z;p.cv.classList.add('drag');
  drag={p,dx:x-p.x,dy:y-p.y};
  try{stage.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
});
stage.addEventListener('pointermove',e=>{
  if(!drag)return;const [x,y]=pt(e);movePiece(drag.p,x-drag.dx,y-drag.dy);
});
function endDrag(snapCheck){
  if(!drag)return;const p=drag.p;drag=null;p.cv.classList.remove('drag');
  if(snapCheck&&Math.hypot(p.x-p.tx,p.y-p.ty)<=T*.4){
    p.cv.classList.add('snap');movePiece(p,p.tx,p.ty);
    p.placed=true;p.cv.classList.add('placed');p.cv.style.zIndex=1;
    setTimeout(()=>p.cv.classList.remove('snap'),160);
    jig.placed.add(p.id);popSound();updateBar();
    if(jig.placed.size===N*N)finish();
  }
}
stage.addEventListener('pointerup',()=>endDrag(true));
stage.addEventListener('pointercancel',()=>endDrag(false));
function finish(){
  done=true;fanfare();
  setTimeout(()=>$('#win').classList.add('on'),2200);   /* deja ver el puzzle terminado antes del 🎉 */
}
function updateBar(){
  if(mode==='jigsaw'&&jig)setBar(jig.placed.size/(N*N));
  else if(mode==='slide'&&order.length){
    let ok=0;order.forEach((v,i)=>{if(v===i&&v!==N*N-1)ok++});setBar(ok/(N*N-1));
  }else setBar(0);
}

/* --- Deslizante --- */
function neighbors(p){
  const x=p%N,y=Math.floor(p/N),a=[];
  if(x>0)a.push(p-1);if(x<N-1)a.push(p+1);if(y>0)a.push(p-N);if(y<N-1)a.push(p+N);return a;
}
function buildSlideView(){
  clearStage();
  L=computeLayout();S=L.S;T=S/N;applyBoard();
  const img='url('+curUrl+')';tiles=[];
  for(let slot=0;slot<N*N;slot++){
    const piece=order[slot],el=document.createElement('div');el.className='tile';
    el.style.width=el.style.height=T+'px';
    el.style.backgroundImage=img;el.style.backgroundSize=S+'px '+S+'px';
    el.style.backgroundPosition='-'+((piece%N)*T)+'px -'+(Math.floor(piece/N)*T)+'px';
    tiles[piece]=el;board.appendChild(el);
    if(piece===N*N-1&&!done)el.classList.add('empty');
  }
  order.forEach((piece,slot)=>{const el=tiles[piece];
    el.style.left=(slot%N)*T+'px';el.style.top=Math.floor(slot/N)*T+'px'});
  updateBar();
}
function slotAt(cx,cy){
  const r=board.getBoundingClientRect(),x=Math.floor((cx-r.left)/T),y=Math.floor((cy-r.top)/T);
  if(x<0||y<0||x>=N||y>=N)return -1;return y*N+x;
}
function afterSlideMove(){
  order.forEach((piece,slot)=>{const el=tiles[piece];
    el.style.left=(slot%N)*T+'px';el.style.top=Math.floor(slot/N)*T+'px'});
  popSound();updateBar();
  if(order.every((v,i)=>v===i)){tiles[N*N-1].classList.remove('empty');finish()}
}
board.addEventListener('pointerdown',e=>{
  if(mode!=='slide'||done)return;
  const slot=slotAt(e.clientX,e.clientY);if(slot<0)return;
  if(neighbors(empty).includes(slot)){
    order[empty]=order[slot];order[slot]=N*N-1;empty=slot;afterSlideMove();
  }
});

/* --- Arranque / reinicio --- */
function newShuffle(){
  if(!curImg)return;
  done=false;drag=null;jig=null;$('#win').classList.remove('on');
  if(mode==='jigsaw'){
    order=[];
    jig={E:newEdges(N),placed:new Set(),pieces:[]};
    buildJigsawView();
  }else{
    const n=N*N,prev=order.join(',');
    let tries=0;
    do{
      order=[...Array(n).keys()];empty=n-1;let last=-1;
      for(let k=0;k<n*30;k++){
        let nb=neighbors(empty);
        if(nb.length>2)nb=nb.filter(x=>x!==last);   /* con solo 2 vecinos (esquinas, 2x2) no se filtra: si no, el barajado era siempre el mismo */
        const m=nb[Math.floor(Math.random()*nb.length)];
        order[empty]=order[m];order[m]=n-1;last=empty;empty=m;
      }
      tries++;
    }while((order.every((v,i)=>v===i)||order.join(',')===prev)&&tries<50);
    buildSlideView();
  }
}
async function startGame(){
  if(!images.length){toast('🖼️');return}
  setTools(false);
  show('game');$('#win').classList.remove('on');
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    curImg=squareCanvas(await loadImg(images[selected].data));
    curUrl=curImg.toDataURL('image/jpeg',.9);
  }catch(e){toast('❌');show('home');return}
  $('#preview').style.backgroundImage='url('+curUrl+')';
  newShuffle();
}
let rz;
window.addEventListener('resize',()=>{
  clearTimeout(rz);
  rz=setTimeout(()=>{
    if(!$('#game').classList.contains('on')||!curImg)return;
    drag=null;
    if(mode==='jigsaw'&&jig)buildJigsawView();else if(mode==='slide'&&order.length)buildSlideView();
  },250);
});

/* botones */
$('#playBtn').onclick=startGame;
$('#shuffleBtn').onclick=newShuffle;
$('#againBtn').onclick=newShuffle;
$('#menuBtn').onclick=()=>show('home');
$('#backBtn').onclick=()=>show('home');
const pv=$('#preview'),peek=$('#peekBtn');
const on=()=>pv.style.display='block',off=()=>pv.style.display='none';
peek.addEventListener('pointerdown',on);peek.addEventListener('pointerup',off);
peek.addEventListener('pointerleave',off);peek.addEventListener('pointercancel',off);

/* botón atrás de Android */
try{
  const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(A)A.addListener('backButton',()=>{
    if($('#gate').classList.contains('on'))return;
    if($('#pin').classList.contains('on'))$('#pin').classList.remove('on');
    else if($('#home').classList.contains('tmode'))setTools(false);
    else if($('#game').classList.contains('on'))show('home');else A.exitApp();
  });
}catch(e){}

loadImages();
})();
